<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f2ec; --surface:#fffefb; --surface-2:#f8f6f0; --sunk:#efece4;
  --ink:#161513; --ink-2:#4b4944; --muted:#696760;
  --line:#e6e3da; --line-2:#d5d2c8;
  --charcoal:#1c1b19;
  --accent:#1f6dcc; --accent-bg:rgba(42,120,214,.10);
  --paid:#2a78d6; --remain:#b7d3f6; --track:#dbe8f9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --warn-line:#b77900;
  --good-bg:rgba(12,163,12,.11); --warn-bg:rgba(250,178,25,.17); --crit-bg:rgba(208,59,59,.10);
  --hatch-a:#ebe9e2; --hatch-b:#b3b0a6;
  --shadow:0 1px 2px rgba(28,24,16,.05),0 6px 20px rgba(28,24,16,.05);
  --r:18px; --r-sm:12px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0e0e0d; --surface:#1a1a19; --surface-2:#20201e; --sunk:#141413;
    --ink:#f0efec; --ink-2:#cbc9c1; --muted:#9c9a91;
    --line:#2c2c2a; --line-2:#3a3a37;
    --charcoal:#121211;
    --accent:#6ea9ef; --accent-bg:rgba(57,135,229,.16);
    --paid:#3987e5; --remain:#184f95; --track:#1e2c40;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good-bg:rgba(12,163,12,.18); --warn-bg:rgba(250,178,25,.15); --crit-bg:rgba(208,59,59,.2); --warn-line:#fab219;
    --hatch-a:#262624; --hatch-b:#5a5852;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e0e0d; --surface:#1a1a19; --surface-2:#20201e; --sunk:#141413;
  --ink:#f0efec; --ink-2:#cbc9c1; --muted:#9c9a91;
  --line:#2c2c2a; --line-2:#3a3a37;
  --charcoal:#121211;
  --accent:#6ea9ef; --accent-bg:rgba(57,135,229,.16);
  --paid:#3987e5; --remain:#184f95; --track:#1e2c40;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good-bg:rgba(12,163,12,.18); --warn-bg:rgba(250,178,25,.15); --crit-bg:rgba(208,59,59,.2); --warn-line:#fab219;
  --hatch-a:#262624; --hatch-b:#5a5852;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--tabs-h,61px) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);overflow-x:hidden}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:0;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.hero{position:relative;background:var(--charcoal);color:#f6f4ee;overflow:hidden;isolation:isolate}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;z-index:-2;opacity:.62}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(18,17,15,.35) 0%,rgba(18,17,15,.55) 45%,rgba(18,17,15,.92) 100%)}
.hero .wrap{padding-top:22px;padding-bottom:22px;min-height:208px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-top{position:absolute;top:14px;left:0;right:0}
.hero-top .wrap{min-height:0;padding:0 16px;flex-direction:row;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:11.5px;text-transform:uppercase;color:#fff}
.brand-mark{display:flex;align-items:flex-end;gap:3px;height:18px}
.brand-mark i{width:5px;border-radius:2px;display:block}
.theme-btn{border:1px solid rgba(255,255,255,.25);background:rgba(20,19,17,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:999px;width:38px;height:38px;display:grid;place-items:center}
.hero h1{font-size:clamp(26px,6.4vw,40px);font-weight:800;color:#fff;max-width:20ch}
.hero p{margin:6px 0 0;color:rgba(255,255,255,.82);font-size:14px}
.stripe{height:5px;background:linear-gradient(90deg,#2a9fd8 0 25%,#f07a2b 25% 50%,#9bc53d 50% 75%,#ef7fa8 75% 100%)}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:0;z-index:30;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.tabs ul{list-style:none;margin:0 auto;padding:0 8px;max-width:1120px;display:flex}
.tabs li{flex:1}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs a svg{width:21px;height:21px}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs a:hover{color:var(--ink)}
@media (min-width:760px){
  .tabs ul{padding:0 16px;gap:4px}
  .tabs li{flex:0 0 auto}
  .tabs a{flex-direction:row;gap:8px;font-size:14px;padding:14px 14px 12px}
  .tabs a svg{width:18px;height:18px}
}

/* ---------- layout ---------- */
main{padding:18px 0 40px}
.view[hidden]{display:none}
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:700}
.card-h .aside{color:var(--muted);font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--ink-2);margin:4px 0 0;font-size:14.5px}
.grid2{display:grid;gap:14px}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr}.card{padding:22px}main{padding-top:24px}.view{gap:18px}.grid2{gap:18px}}
.link-btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--accent);background:none;border:0;padding:6px 0;text-decoration:none}
.link-btn:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn svg{width:17px;height:17px}

/* ---------- hero fund card ---------- */
.fund .hero-num{font-size:clamp(26px,9vw,56px);font-weight:800;letter-spacing:-.025em;line-height:1.05;margin-top:6px}
.fund .hero-sub{color:var(--ink-2);margin-top:6px;font-size:15px}
.fund .hero-sub b{color:var(--ink)}
.stack{display:flex;gap:2px;height:22px;margin:18px 0 12px;border-radius:6px}
.stack > span{display:block;min-width:3px;height:100%;position:relative}
.stack > span:first-child{border-radius:6px 0 0 6px}
.stack > span:last-child{border-radius:0 6px 6px 0}
.hatch{background:repeating-linear-gradient(135deg,var(--hatch-a) 0 5px,var(--hatch-b) 5px 6.5px)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.legend li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:9px;row-gap:1px;align-items:center;font-size:14px;color:var(--ink-2)}
.legend .sw{width:12px;height:12px;border-radius:3px}
.legend b{color:var(--ink);font-weight:700;text-align:right;white-space:nowrap}
.legend .lg-p{font-weight:500;color:var(--muted);font-size:12.5px}
.legend .lg-s{grid-column:2/-1;display:block;color:var(--muted);font-size:12.5px}
@media (max-width:400px){.legend li{grid-template-columns:14px minmax(0,1fr)}.legend b{grid-column:2;text-align:left}}
@media (min-width:860px){.fund .legend{grid-template-columns:repeat(3,1fr);gap:16px}.fund .legend li{grid-template-columns:14px 1fr;align-items:start}.fund .legend li b{grid-column:2;text-align:left}.fund .legend .sw{margin-top:5px}}
.inkind{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.45}
.inkind svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--muted)}
.inkind b{color:var(--ink)}
.target-line{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:-6px;margin-bottom:12px}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:860px){.tiles{grid-template-columns:repeat(4,1fr);gap:18px}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .val{font-size:clamp(20px,5.4vw,26px);font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.tile .note{font-size:12.5px;color:var(--ink-2);margin-top:4px}

/* ---------- status ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 6px;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.chip svg{width:15px;height:15px;flex:none}
.chip.lunas{background:var(--good-bg)}
.chip.sebagian{background:var(--warn-bg)}
.chip.belum{background:var(--crit-bg)}
.chip.neutral{background:var(--sunk);color:var(--ink-2);padding-left:10px}
.status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st-tile{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:12px;text-align:left;display:grid;gap:2px;min-width:0}
.st-tile:hover{border-color:var(--line-2);background:var(--sunk)}
.st-tile .top{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.st-tile .top svg{width:16px;height:16px;flex:none}
.st-tile .n{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.st-tile .n small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.waffle{display:grid;grid-template-columns:repeat(14,minmax(0,26px));gap:4px;margin-top:16px}
@media (max-width:480px){.waffle{grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}}
.waffle button{aspect-ratio:1;border-radius:4px;border:0;padding:0;min-width:0}
.waffle .lunas{background:var(--good)}
.waffle .sebagian{background:linear-gradient(135deg,var(--warn) 0 50%,var(--warn-bg) 50% 100%);box-shadow:inset 0 0 0 1.5px var(--warn-line)}
.waffle .belum{background:transparent;box-shadow:inset 0 0 0 1.5px var(--crit)}
.waffle button:hover{transform:scale(1.12)}
.waffle-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.waffle-legend span{display:inline-flex;align-items:center;gap:6px}
.waffle-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---------- meters ---------- */
.meters{display:grid;gap:4px}
.meter{display:grid;gap:6px;padding:10px 8px;margin:0 -8px;border-radius:10px;text-align:left;border:0;background:none;width:calc(100% + 16px)}
button.meter:hover{background:var(--surface-2)}
.meter .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter .name{font-weight:700;font-size:14.5px}
.meter .name small{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:4px}
.meter .pct{font-weight:700;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--paid);border-radius:4px;min-width:0}
.meter .row2{font-size:12.5px;color:var(--muted)}
.meter .row2 b{color:var(--ink-2);font-weight:600}

/* ---------- feed ---------- */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0;padding-top:0}
.feed .who{font-weight:600;font-size:14.5px;min-width:0}
.feed .amt{font-weight:700;font-size:14.5px;text-align:right}
.feed .meta{font-size:12.5px;color:var(--muted);grid-column:1/-1}

/* ---------- teasers ---------- */
.teaser{padding:0;overflow:hidden;display:grid;text-decoration:none;color:inherit}
.teaser .ph{aspect-ratio:16/8;background:var(--sunk);overflow:hidden}
.teaser .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.teaser:hover .ph img{transform:scale(1.03)}
.teaser .tx{padding:14px 18px 16px}
.teaser h3{font-size:16px;font-weight:700}
.teaser p{margin:3px 0 0;color:var(--ink-2);font-size:13.5px}
.ph-empty{width:100%;height:100%;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600;background:repeating-linear-gradient(135deg,var(--surface-2) 0 14px,var(--sunk) 14px 15px)}
.ph-empty svg{width:30px;height:30px}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:16/8}
.mosaic img{width:100%;height:100%;object-fit:cover}
.mosaic img:first-child{grid-row:1/3}

/* ---------- skema ---------- */
.rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:860px){.rate-grid{grid-template-columns:repeat(3,1fr)}}
.rate{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px;background:var(--surface-2);min-width:0}
.rate .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rate .v{font-size:clamp(17px,4.6vw,21px);overflow-wrap:anywhere;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.rate .d{font-size:13px;color:var(--ink-2);margin-top:2px}
.formula{display:grid;gap:10px;margin-top:4px}
.f-row{border-left:3px solid var(--line-2);padding:4px 0 4px 12px}
.f-row .t{font-weight:700;font-size:14.5px}
.f-row .eq{font-size:14px;color:var(--ink-2)}
.f-row .ex{font-size:13px;color:var(--muted);margin-top:2px}
.notes{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--ink-2);font-size:14px}
.calc{display:grid;gap:14px}
@media (min-width:860px){.calc{grid-template-columns:1fr 1fr;align-items:start}}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button svg{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.seg button .c{font-weight:500;color:var(--muted);font-size:12.5px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.stepper .l{font-weight:600;font-size:14.5px}
.stepper .l small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.stepper output{min-width:34px;text-align:center;font-weight:800;font-size:18px}
.calc-out{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px}
.calc-out .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.lines{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:14px}
.lines li{display:flex;justify-content:space-between;gap:12px;color:var(--ink-2)}
.lines li b{color:var(--ink);font-weight:600;white-space:nowrap}
.lines li.tot{border-top:1px solid var(--line-2);padding-top:8px;margin-top:2px;color:var(--ink);font-weight:700}
.lines li.tot b{font-weight:800}
.lines li.note{font-size:12.5px;color:var(--muted)}

/* ---------- people list ---------- */
.toolbar{display:grid;gap:10px;margin-bottom:12px}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:11px 14px 11px 40px;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.selects{display:flex;gap:8px;flex-wrap:wrap}
.selects label{position:relative;display:inline-flex;align-items:center}
.selects select{appearance:none;-webkit-appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 30px 7px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.selects label::after{content:"";position:absolute;right:12px;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-2px) rotate(45deg);pointer-events:none}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px 6px 10px;font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pills button svg{width:15px;height:15px}
.pills button .c{font-weight:500;color:var(--muted);font-size:12.5px}
.pills button:hover{border-color:var(--ink-2)}
.pills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pills button[aria-pressed="true"] .c{color:inherit;opacity:.75}
.pills button[aria-pressed="true"] svg circle[fill="none"]{stroke:currentColor}

<script>
(function(){
"use strict";
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

var IU = J("data-iuran"), DS = J("data-desain"), RV = J("data-renovasi");

/* ---------- format ---------- */
var nf = new Intl.NumberFormat("id-ID");
function rp(n){ return (n < 0 ? "−" : "") + "Rp" + nf.format(Math.abs(n)); }
function dec(v, d){ d = d || 2; var m = Math.pow(10, d); return (Math.round(v * m) / m).toFixed(d).replace(/\.?0+$/, "").replace(".", ","); }
function rpk(n){
  var a = Math.abs(n), s = n < 0 ? "−" : "";
  if (a >= 1e9) return s + "Rp" + dec(a / 1e9, 3) + "\u00a0M";
  if (a >= 1e6) return s + "Rp" + dec(a / 1e6) + "\u00a0jt";
  if (a >= 1e3) return s + "Rp" + dec(a / 1e3) + "\u00a0rb";
  return rp(n);
}
function pct(v){ var p = v * 100; if (p >= 99.95 && p < 100) return "99,9%"; if (p > 0 && p < 0.05) return "<0,1%"; return p.toFixed(1).replace(".", ",") + "%"; }
var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
function pd(s){ var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function tglPanjang(s){ var d = pd(s); return HARI[d.getDay()] + ", " + d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear(); }
function tgl(s){ var d = pd(s); return d.getDate() + " " + BULAN[d.getMonth()].slice(0, 3) + " " + d.getFullYear(); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---------- icons ---------- */
function svg(p, vb){ return '<svg viewBox="' + (vb || "0 0 24 24") + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + "</svg>"; }
var IC = {
  ringkasan: svg('<rect x="3" y="3" width="7.5" height="9" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.6"/><rect x="3" y="15" width="7.5" height="6" rx="1.6"/>'),
  skema: svg('<rect x="4.5" y="2.5" width="15" height="19" rx="2.2"/><path d="M8 7h8"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18.4h.01M12 18.4h.01M15.5 18.4h.01" stroke-width="2.4"/>'),
  pembayaran: svg('<circle cx="9" cy="8" r="3.6"/><path d="M2.5 20.5a6.5 6.5 0 0 1 13 0"/><path d="m15.8 11.2 2.2 2.2 4.2-4.6"/>'),
  desain: svg('<rect x="3" y="4" width="18" height="16" rx="2.2"/><circle cx="9" cy="9.5" r="1.8"/><path d="m21 15.5-4.8-4.8L6 20.5"/>'),
  renovasi: svg('<path d="M2.5 19h19"/><path d="M4.5 19v-2.6a7.5 7.5 0 0 1 15 0V19"/><path d="M10 9.2V6.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2.7"/><path d="M8 19v-3M16 19v-3"/>'),
  cari: svg('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>'),
  salin: svg('<rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/>'),
  panah: svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  chev: svg('<path d="m6 9 6 6 6-6"/>'),
  foto: svg('<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.2"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>'),
  info: svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6h.01" stroke-width="2.2"/>'),
  moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>')
};
var ST = {
  lunas:   { label: "Lunas",       icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--good)"/><path d="m4.9 8.3 2.1 2.1 4.1-4.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
  sebagian:{ label: "Sebagian",    icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--warn-line)" stroke-width="1.7"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="var(--warn-line)"/></svg>' },
  belum:   { label: "Belum bayar", icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--crit)" stroke-width="1.7"/><path d="m5.9 5.9 4.2 4.2m0-4.2-4.2 4.2" stroke="var(--crit)" stroke-width="1.7" stroke-linecap="round"/></svg>' }
};
function joinUniq(arr){ var u = arr.filter(function(x, i){ return arr.indexOf(x) === i; }); return u.length > 1 ? u.slice(0, -1).join(", ") + " dan " + u[u.length - 1] : u.join(""); }
function chip(st){ return '<span class="chip ' + st + '">' + ST[st].icon + ST[st].label + "</span>"; }

/* ---------- derived data ---------- */
var paidBy = {}, payBy = {};
IU.pembayaran.forEach(function(p, i){ p._i = i; paidBy[p.nama] = (paidBy[p.nama] || 0) + p.nominal; (payBy[p.nama] = payBy[p.nama] || []).push(p); });
var ORDER = { lunas: 0, sebagian: 1, belum: 2 };
var P = IU.anggota.map(function(a, i){
  var dibayar = paidBy[a.nama] || 0;
  var st = dibayar >= a.kewajiban ? "lunas" : dibayar > 0 ? "sebagian" : "belum";
  return Object.assign({}, a, { id: i, dibayar: dibayar, sisa: Math.max(0, a.kewajiban - dibayar), lebih: Math.max(0, dibayar - a.kewajiban), st: st, pays: payBy[a.nama] || [] });
});
function sum(arr, k){ return arr.reduce(function(s, x){ return s + x[k]; }, 0); }
var T = {
  target: IU.target,
  kewajiban: sum(P, "kewajiban"),
  iuranMasuk: sum(IU.pembayaran, "nominal"),
  sisa: sum(P, "sisa"),
  subsidi: IU.subsidi_kantor.nominal,
  subsidiMasuk: IU.subsidi_kantor.diterima || 0
};
T.lebih = sum(P, "lebih");
T.iuranEfektif = T.iuranMasuk - T.lebih;
T.terkumpul = T.iuranMasuk + T.subsidiMasuk;
T.subsidiSisa = Math.max(0, T.subsidi - T.subsidiMasuk);
T.belumMasuk = T.sisa + T.subsidiSisa;
T.langsung = IU.pembayaran.filter(function(p){ return p.langsung; });
T.langsungSum = sum(T.langsung, "nominal");
T.count = { lunas: 0, sebagian: 0, belum: 0 };
P.forEach(function(p){ T.count[p.st]++; });
function byDefault(a, b){ return ORDER[a.st] - ORDER[b.st] || b.kewajiban - a.kewajiban || a.id - b.id; }

function timText(p){
  if (p.posisi === "JD") return p.staff ? p.staff + " staff" : "tanpa staff";
  if (!p.staff && !p.jd_bawah && !p.de_bawah) return "tanpa tim";
  var t = [];
  if (p.staff) t.push(p.staff + " staff");
  if (p.jd_bawah) t.push(p.jd_bawah + " JD");
  if (p.de_bawah) t.push(p.de_bawah + " DE");
  return t.join(", ");
}
function shortName(p){ return p.panggilan ? p.nama.replace(/\s*\([^)]*\)/, "") : p.nama; }
function posLabel(p){ return p.posisi === "Komitmen" ? "Komitmen" : p.posisi; }
function grupLabel(g){ return g === "-" ? "Luar struktur" : g; }
function uplineText(p){
  if (p.luar_struktur) return "di luar struktur";
  if (/root/.test(p.upline)) return "puncak struktur";
  return "upline " + p.upline;
}
function rincian(p){
  var L = [];
  if (p.komitmen_budget) L.push(["Komitmen budget", p.komitmen_budget]);
  if (p.iuran_pribadi) L.push(["Iuran pribadi " + p.posisi, p.iuran_pribadi]);
  if (p.staff && p.tarif_staff) L.push(["Tanggungan " + p.staff + " staff × " + rpk(p.tarif_staff), p.staff * p.tarif_staff]);
  if (p.jd_bawah && p.tarif_jd) L.push(["Tanggungan " + p.jd_bawah + " JD × " + rpk(p.tarif_jd), p.jd_bawah * p.tarif_jd]);
  return L;
}

/* ---------- tabs & routing ---------- */
var TABS = [["ringkasan","Ringkasan"],["skema","Skema Iuran"],["pembayaran","Pembayaran"],["desain","Desain"],["renovasi","Renovasi"]];
var SHORT = { skema: "Skema" };
$("#tabs").innerHTML = TABS.map(function(t){
  return '<li><a href="#' + t[0] + '" id="t-' + t[0] + '" data-tab="' + t[0] + '">' + IC[t[0]] + '<span class="lbl" data-full="' + t[1] + '" data-short="' + (SHORT[t[0]] || t[1]) + '">' + t[1] + "</span></a></li>";
}).join("");
function fitTabLabels(){
  var narrow = window.innerWidth < 760;
  $$("#tabs .lbl").forEach(function(l){ l.textContent = narrow ? l.dataset.short : l.dataset.full; });
}
function setTabsH(){ root.style.setProperty("--tabs-h", $(".tabs").offsetHeight + "px"); }
fitTabLabels(); window.addEventListener("resize", function(){ fitTabLabels(); setTabsH(); });
var rendered = {};
function show(tab, opts){
  if (!TABS.some(function(t){ return t[0] === tab; })) tab = "ringkasan";
  TABS.forEach(function(t){
    var on = t[0] === tab;
    $("#v-" + t[0]).hidden = !on;
    var a = $("#t-" + t[0]);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (!rendered[tab]) { VIEWS[tab](); rendered[tab] = true; }
  if (!(opts && opts.keepScroll)) {
    var top = $(".stripe").getBoundingClientRect().bottom + window.scrollY;
    if (window.scrollY > top) window.scrollTo(0, top);
  }
}
function go(tab){ if (location.hash !== "#" + tab) history.pushState(null, "", "#" + tab); show(tab); }
window.addEventListener("popstate", function(){
  if (!lb.hidden) { lbClose(true); return; }
  show((location.hash || "#ringkasan").slice(1));
});
document.addEventListener("click", function(e){
  var a = e.target.closest("[data-go]");
  if (a) { e.preventDefault(); go(a.dataset.go); }
  var t = e.target.closest("#tabs a");
  if (t) { e.preventDefault(); go(t.dataset.tab); }
});

/* ---------- theme ---------- */
function curTheme(){ return root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function paintThemeBtn(){ $("#themeBtn").innerHTML = curTheme() === "dark" ? IC.sun : IC.moon; }
try { var saved = localStorage.getItem("svo-theme"); if (saved === "dark" || saved === "light") root.dataset.theme = saved; } catch (e) {}
paintThemeBtn();
$("#themeBtn").addEventListener("click", function(){
  var next = curTheme() === "dark" ? "light" : "dark";
  root.dataset.theme = next; paintThemeBtn();
  try { localStorage.setItem("svo-theme", next); } catch (e) {}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener && matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn);

/* ---------- tooltip ---------- */
var tip = $("#tip");
function placeTip(x, y){
  var w = tip.offsetWidth, h = tip.offsetHeight;
  var left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8);
  var top = y - h - 12; if (top < 8) top = y + 18;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function showTip(el, x, y){ tip.textContent = el.dataset.tip; tip.classList.add("on"); placeTip(x, y); }
function hideTip(){ tip.classList.remove("on"); }
document.addEventListener("pointermove", function(e){
  var el = e.target.closest && e.target.closest("[data-tip]");
  if (el && e.pointerType === "mouse") showTip(el, e.clientX, e.clientY); else if (e.pointerType === "mouse") hideTip();
});
document.addEventListener("focusin", function(e){
  var el = e.target.closest && e.target.closest("[data-tip]");
  if (el) { var r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } else hideTip();
});
document.addEventListener("scroll", hideTip, { passive: true });
document.addEventListener("focusout", hideTip);
document.addEventListener("pointerdown", function(e){ if (!(e.target.closest && e.target.closest("[data-tip]"))) hideTip(); });

/* ---------- toast & copy ---------- */
var toastT;
function toast(msg){ var t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, 2400); }
function copyText(txt){
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta); return ok;
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(function(){ toast("Rekap disalin. Tinggal tempel di WhatsApp."); }, function(){ toast(fallback() ? "Rekap disalin. Tinggal tempel di WhatsApp." : "Gagal menyalin. Coba lagi."); });
  } else toast(fallback() ? "Rekap disalin. Tinggal tempel di WhatsApp." : "Gagal menyalin. Coba lagi.");
}

function stackBar(segs, label){
  var tot = segs.reduce(function(s, x){ return s + x.v; }, 0) || 1;
  return '<div class="stack" role="img" aria-label="' + esc(label) + '">' + segs.filter(function(s){ return s.v > 0; }).map(function(s){
    return '<span class="' + (s.cls || "") + '" style="flex:' + (s.v / tot * 100).toFixed(3) + " 1 0;" + (s.c ? "background:" + s.c : "") + '" data-tip="' + esc(s.name + ": " + rp(s.v) + " (" + pct(s.v / tot) + ")") + '"></span>';
  }).join("") + "</div>";
}
function legend(segs, tot){
  return '<ul class="legend">' + segs.map(function(s){
    return '<li><span class="sw ' + (s.cls || "") + '" style="' + (s.c ? "background:" + s.c : "") + '"></span><span class="lg-n">' + esc(s.name) + '</span><b class="num">' + rp(s.v) + (tot ? ' <small class="lg-p">· ' + pct(s.v / tot) + "</small>" : "") + "</b>" + (s.sub ? '<small class="lg-s">' + esc(s.sub) + "</small>" : "") + "</li>";
  }).join("") + "</ul>";
}
function meterRow(name, sub, paid, total, attrs){
  var r = total ? paid / total : 0;
  var tag = attrs ? 'button type="button" ' + attrs : "div";
  return "<" + tag + ' class="meter">' +
    '<div class="row1"><span class="name">' + esc(name) + (sub ? "<small>" + esc(sub) + "</small>" : "") + '</span><span class="pct num">' + pct(r) + "</span></div>" +
    '<div class="bar" aria-hidden="true"><i style="width:' + Math.min(100, r * 100) + '%"></i></div>' +
    '<div class="row2"><b class="num">' + rp(paid) + '</b> dari <span class="num">' + rp(total) + "</span></div>" +
  "</" + (attrs ? "button" : "div") + ">";
}

var F = { q: "", st: "all", pos: "all", grup: "all", sort: "status" };
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/['\u2018\u2019`\u00b4]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim(); }
P.forEach(function(p){ p._q = norm(p.nama + " " + (p.panggilan || "") + " " + p.posisi + " " + grupLabel(p.grup) + " " + p.upline); });
function filtered(){
  var q = norm(F.q);
  var arr = P.filter(function(p){
    return (F.st === "all" || p.st === F.st) && (F.pos === "all" || p.posisi === F.pos) && (F.grup === "all" || p.grup === F.grup) &&
      (!q || q.split(" ").every(function(w){ return p._q.indexOf(w) >= 0; }));
  });
  var s = { status: byDefault,
    sisa: function(a, b){ return b.sisa - a.sisa || byDefault(a, b); },
    kewajiban: function(a, b){ return b.kewajiban - a.kewajiban || a.id - b.id; },
    dibayar: function(a, b){ return b.dibayar - a.dibayar || byDefault(a, b); },
    nama: function(a, b){ return a.nama.localeCompare(b.nama, "id"); } }[F.sort];
  return arr.sort(s);
}
function personRow(p){
  var r = p.kewajiban ? Math.min(1, p.dibayar / p.kewajiban) : 0;
  return '<li class="person" data-id="' + p.id + '">' +

function rekapWA(){

  out.push("");

  out.push("Target: " + rp(T.target));
  if (T.langsungSum) out.push("(termasuk " + rp(T.langsungSum) + " dibayar langsung untuk " + joinUniq(T.langsung.map(function(x){ return x.langsung_untuk || "keperluan kantor"; })) + ")");

      ents.forEach(function(en){

      "<h3>" + esc(e.judul) + "</h3>" +
      (e.isi ? "<p>" + esc(e.isi) + "</p>" : "") +
      (e.poin && e.poin.length ? '<ul class="tl-pts">' + e.poin.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") +
      (e.link ? '<p><button class="link-btn" data-go="' + esc(e.link) + '">Buka tab ' + esc(e.link.charAt(0).toUpperCase() + e.link.slice(1)) + " " + IC.panah.replace('aria-hidden="true"', 'aria-hidden="true" width="16" height="16"') + "</button></p>" : "") +
      (shown.length ? '<div class="gal sq">' + shown.map(function(f, i){
        var more = (i === MAXT - 1 && fotos.length > MAXT) ? fotos.length - MAXT + 1 : 0;
        return '<button type="button" class="thumb" data-lb="renovasi" data-i="' + (base + i) + '" aria-label="' + (more ? "Lihat " + more + " foto lainnya" : "Buka foto: " + esc(f.ket || e.judul)) + '"><img src="img/progres/' + f.f + '-640.webp" sizes="(min-width:860px) 240px, 33vw" srcset="' + srcset("img/progres/", f.f) + '" loading="lazy" decoding="async" alt="' + esc(f.ket || e.judul) + '">' + (more ? '<span class="more">+' + more + "</span>" : "") + "</button>";
      }).join("") + "</div>" : "") +
    "</li>";
  }).join("") + "</ol></div>" +

  (KP.length ? '<div class="card"><div class="card-h"><h2>Keputusan yang sudah disepakati</h2><span class="aside">dari diskusi di grup proyek</span></div><ul class="feed">' +
    KP.map(function(x){ return '<li><span class="who" style="font-weight:600">' + esc(x.isi) + '</span><span class="amt" style="font-weight:600;color:var(--muted);font-size:12.5px">' + tgl(x.tanggal) + "</span>" + (x.ket ? '<span class="meta">' + esc(x.ket) + "</span>" : "") + "</li>"; }).join("") + "</ul></div>" : "");
}

/* ---------- lightbox ---------- */
var LB = { list: null, i: 0, last: null, tok: 0, pushed: false };
var lb = $("#lb"), lbImg = $("#lbImg");
function lbShow(){
  var it = LB.list[LB.i], tok = ++LB.tok;
  var big = it.dir + it.f + "-1600.webp", small = it.dir + it.f + "-640.webp";
  lbImg.src = small;
  var hi = new Image(); hi.onload = function(){ if (tok === LB.tok && !lb.hidden) lbImg.src = big; }; hi.src = big;
  lbImg.alt = it.title + ", " + it.sub;
  $("#lbCap").innerHTML = "<b>" + esc(it.title) + "</b><span>" + esc(it.sub) + "</span>";
  $("#lbCount").textContent = (LB.i + 1) + " / " + LB.list.length;
  [1, -1].forEach(function(d){ var n = LB.list[(LB.i + d + LB.list.length) % LB.list.length]; var im = new Image(); im.src = n.dir + n.f + "-1600.webp"; });
}
function lbOpen(list, i){
  LB.list = list; LB.i = i; LB.last = document.activeElement;
  lb.hidden = false; document.body.style.overflow = "hidden"; lbShow(); $("#lbClose").focus();
  try { history.pushState({ lb: 1 }, "", location.href); LB.pushed = true; } catch (e) { LB.pushed = false; }
}
function lbClose(fromPop){
  if (lb.hidden) return;
  lb.hidden = true; document.body.style.overflow = ""; LB.tok++; lbImg.removeAttribute("src");
  if (LB.last) LB.last.focus({ preventScroll: true });
  if (LB.pushed && fromPop !== true) { LB.pushed = false; history.back(); } else LB.pushed = false;
}
function lbStep(d){ LB.i = (LB.i + d + LB.list.length) % LB.list.length; lbShow(); }
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-lb]"); if (t) { lbOpen(t.dataset.lb === "desain" ? GAL : RGAL, +t.dataset.i); }
});
$("#lbClose").addEventListener("click", function(){ lbClose(); });
$$("#lb [data-step]").forEach(function(b){ b.addEventListener("click", function(){ lbStep(+b.dataset.step); }); });
$("#lbStage").addEventListener("click", function(e){ if (e.target === e.currentTarget) lbClose(); });
document.addEventListener("keydown", function(e){
  if (lb.hidden) return;
  if (e.key === "Escape") lbClose();
  else if (e.key === "ArrowRight") lbStep(1);
  else if (e.key === "ArrowLeft") lbStep(-1);
  else if (e.key === "Tab") {
    var f = $$("#lb button").filter(function(b){ return b.offsetParent; });
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
var sx = null, sy = null, multi = false;
$("#lbStage").addEventListener("touchstart", function(e){
  if (e.touches.length > 1) { multi = true; sx = sy = null; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, { passive: true });
$("#lbStage").addEventListener("touchend", function(e){
  if (e.touches.length) return;
  var m = multi; multi = false;
  if (sx == null || m || (window.visualViewport && visualViewport.scale > 1.01)) { sx = sy = null; return; }
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) lbStep(dx < 0 ? 1 : -1);
  else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) lbClose();
  sx = sy = null;
}, { passive: true });

/* ---------- boot ---------- */
var VIEWS = { ringkasan: renderRingkasan, skema: renderSkema, pembayaran: renderPembayaran, desain: renderDesain, renovasi: renderRenovasi };
setTabsH();
$("#asof").textContent = "Data per " + tglPanjang(IU.posisi_data);
$("#footAsof").textContent = "Posisi data " + tglPanjang(IU.posisi_data);
show((location.hash || "#ringkasan").slice(1), { keepScroll: true });
})();
</script>
